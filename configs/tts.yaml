voice_bank:
  out_dir: ${paths.processed}/voices
  lines: ${paths.processed}/anime/lines_named.jsonl
  audio_dir: ${paths.interim}/anime                  # epNN/vocals.wav (preferred) or epNN/audio_jpn.wav
  stems: [vocals.wav, audio_jpn.wav]                 # first existing file wins
  min_conf: 0.45                # LLM-only speaker labels carry conf 0.5; wrong labels are removed by the consistency filter
  min_sec: 2.5
  max_sec: 12.0
  ideal_sec: [5.0, 10.0]
  merge_gap_sec: 0.8          # merge adjacent lines of the same speaker when the gap is at most this
  guard_sec: 0.15             # a candidate must not come closer than this to another speaker's line
  edge_pad_sec: 0.08          # padding added around subtitle times before trimming on energy
  max_candidates: 60          # per speaker, embedded and scored
  n_refs: 8                   # written per speaker
  n_default: 3                # refs listed in default_refs (what tts.py concatenates)
  min_consistency: 0.45       # cosine to the speaker centroid; below = probably a wrong label / overlap
  min_snr_db: 12.0            # speech-vs-floor proxy (P95 - P10 frame level) on separated vocals; below = bleed
  min_snr_db_mix: 4.0         # same proxy when only the full mix exists (music raises the floor): fallback mode
  min_speech_ratio: 0.55
  diversity_sec: 20.0         # two refs from the same episode must be at least this far apart
  weights: {consistency: 0.45, snr: 0.25, duration: 0.15, speech_ratio: 0.10, conf: 0.05}

voice_metrics:
  spk_model: speechbrain/spkrec-ecapa-voxceleb       # non-gated; cached under tts.hf_cache
  spk_model_dir: ${paths.models}/tts/spkrec-ecapa-voxceleb
  asr_model_dir: ${paths.models}/asr/faster-whisper-large-v3
  asr_compute_type: float16
  asr_beam: 5
  asr_initial_prompt: null    # e.g. "古見さん、只野くん、長名なじみ。" biases name spelling (can hallucinate on tiny clips)
  vram_gb: 6
  # evidence thresholds (flags for the judge, not verdicts)
  flag_sim_below: 0.35
  flag_cer_above: 0.25
  flag_wer_above: 0.25        # English rows (WER)
  flag_dur_rel_above: 0.10
