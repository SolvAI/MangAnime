show:
  title: "Komi Can't Communicate (Komi-san wa, Komyushou desu.)"
  setting: "Itan Private High School, class 1-1; modern Japanese suburb"
  style: "bright, clean TV anime (OLM, 2021–22): flat pastel colouring, thin outlines, soft school lighting; comedy beats use simplified chibi faces, bold on-screen text and speed lines"
  conventions:
    - "Komi rarely speaks: her lines are usually handwritten in a notebook shown on screen (pencil-scratch sound); others read it."
    - "A calm female narrator explains situations ('Komi-san has a communication disorder')."
    - "Each manga chapter is one 'Communication' segment that opens with a short title card."
    - "Inner monologues are common (Tadano's retorts, Katai's anxieties) and are voiced over reaction shots."
