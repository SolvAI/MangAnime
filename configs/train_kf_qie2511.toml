# musubi-tuner --config_file: Qwen-Image-Edit-2511 keyframe LoRA (manga panel [+ character reference] -> anime frame).
# Paths, step counts and memory options are passed on the command line by src/train/kf_lora.py (local smoke)
# and infra/hf_jobs/train_job.py (HF job); command-line options override this file.
# Source: musubi-tuner docs/qwen_image.md @ f8a1b037 (edit-2511 mode, bf16 DiT required, example hyper-parameters).

[model]
model_version = "edit-2511"
mixed_precision = "bf16"
sdpa = true
gradient_checkpointing = true

[network]
network_module = "networks.lora_qwen_image"
network_dim = 32
network_alpha = 16

[optimizer]
optimizer_type = "adamw8bit"
learning_rate = 5e-5
max_grad_norm = 1.0
lr_scheduler = "constant_with_warmup"   # resume-safe: musubi restarts its step counter at 0 after --resume
lr_warmup_steps = 100

[timesteps]
timestep_sampling = "shift"
weighting_scheme = "none"
discrete_flow_shift = 2.2           # docs example value for Qwen-Image

[data]
max_data_loader_n_workers = 2
persistent_data_loader_workers = true
seed = 42

[output]
save_precision = "fp16"
metadata_title = "komi_kf_qie2511"
metadata_description = "Komi POC keyframe LoRA, Qwen-Image-Edit-2511: manga panel (+ character reference) to anime frame"
log_with = "tensorboard"
