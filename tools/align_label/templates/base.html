<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Alignment labeling{% endblock %}</title>
<style>
:root{--bg:#f6f6f4;--fg:#1c1c1e;--mut:#6b6b70;--card:#fff;--line:#d9d9de;--acc:#2f6fed;--onacc:#fff;--ok:#1d8a4a;--warn:#b25b00;--bad:#b3261e;--auto:#8a63d2}
@media (prefers-color-scheme:dark){:root{--bg:#131316;--fg:#ececf0;--mut:#9a9aa3;--card:#1d1d22;--line:#34343c;--acc:#7aa5ff;--onacc:#0b1020;--ok:#5ad08a;--warn:#f0a858;--bad:#ff8a80;--auto:#b79cf0}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600}
header .sp{flex:1}
a{color:var(--acc)}
.mut{color:var(--mut)}
button,.btn{font:inherit;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
input[type=text]{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;margin:10px 0}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
code{font:12.5px ui-monospace,monospace;word-break:break-all}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:12px ui-monospace,monospace;background:var(--card)}
.badge{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--mut);white-space:nowrap}
.b-confirmed{color:var(--ok);border-color:var(--ok)}
.b-no_match{color:var(--bad);border-color:var(--bad)}
.b-auto{color:var(--auto);border-color:var(--auto)}
{% block css %}{% endblock %}
</style>
</head>
<body>
<header><h1><a href="/" style="color:inherit;text-decoration:none">Alignment labeling</a></h1>{% block head %}{% endblock %}</header>
{% block body %}{% endblock %}
</body>
</html>
