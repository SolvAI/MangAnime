<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cluster review{% endblock %}</title>
<style>
:root{--bg:#f6f6f4;--fg:#1c1c1e;--mut:#6b6b70;--card:#fff;--line:#d9d9de;--acc:#2f6fed;--onacc:#fff;--ok:#1d8a4a;--warn:#b25b00;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#131316;--fg:#ececf0;--mut:#9a9aa3;--card:#1d1d22;--line:#34343c;--acc:#7aa5ff;--onacc:#0b1020;--ok:#5ad08a;--warn:#f0a858;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:16px;margin:0;font-weight:600}
header .sp{flex:1}
a{color:var(--acc)}
main{padding:14px 16px;max-width:1400px;margin:0 auto}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card.reviewed{border-left:4px solid var(--ok)}
.card.junk{opacity:.6}
.card.low:not(.reviewed){border-left:4px solid var(--warn)}
button,.btn{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
input[type=text]{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:200px}
.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--mut);white-space:nowrap}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.ex{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ex img{height:128px;border-radius:6px;background:#000;display:block}
.ex .aud{border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:330px}
.ex .aud audio{width:300px;height:32px;display:block}
.ex .aud div{font-size:13px;margin-top:2px}
.ex .missing{font-size:12px;color:var(--bad);border:1px dashed var(--bad);border-radius:6px;padding:6px}
.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;margin:10px 0}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
code{font:13px ui-monospace,monospace;word-break:break-all}
.state{font-size:13px}
</style>
</head>
<body>
<header><h1><a href="/" style="color:inherit;text-decoration:none">Cluster review</a></h1>{% block head %}{% endblock %}</header>
<main>{% block main %}{% endblock %}</main>
</body>
</html>
